  <!-- Hero Section -->
  <section id="hero" class="hero-section"
  style='
  background-image: linear-gradient(#221502da, #c0985c6d), url("{{img}}"); 
  '
  >
    <div class="container d-flex flex-column justify-content-center" 
    style="min-height: 70vh;">
      <div class="row align-items-center">
        <div class="col-lg-7 hero-content">
          <h1 id="fireworks_titulo"></h1>
          <h1> {{Titulo1}} <mark>{{TituloMark}}</mark></h1>
          <p> {{SubTitulo}} <strong> {{SubTituloStrong}} </strong> 
            {{info}}
          <div class="d-flex flex-wrap gap-3">
            <a href="{{href_butom1}}" class="btn btn-gold">{{butom1}}</a>
            <a href="{{href_butom2}}" class="btn btn-outline-light">{{butom2}}</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener("ensamblar:ready", () => {
      (function() {
        // ---------- 1. Calcular años desde el 19 mayo 2022 ----------
        function calcularAnios() {
          const inicio = new Date(2022, 4, 19); // mes 4 = mayo (0-11)
          const hoy = new Date();
          let anios = hoy.getFullYear() - inicio.getFullYear();
          const aniversarioEsteAnio = new Date(hoy.getFullYear(), 4, 19);
          if (hoy < aniversarioEsteAnio) anios--;
          return Math.max(0, anios);
        }

        // ---------- 2. Cargar el SVG, reemplazar marcador, aplicar ----------
        function aplicarLogoAniversario() {
          const hero = document.querySelector(".hero-section");
          if (!hero) {
            console.warn("No se encontró .hero-section");
            return;
          }

          fetch("./src/img/aniversario.svg")
            .then(respuesta => {
              if (!respuesta.ok) throw new Error("No se pudo cargar aniversario.svg");
              return respuesta.text();
            })
            .then(svgTexto => {
              const anios = calcularAnios();
              const svgConNumero = svgTexto.replace("__ANIOS__", anios);

              // Convertir a Data URI (encodeURIComponent para caracteres especiales)
              const dataUri = "data:image/svg+xml;charset=utf-8," +
                              encodeURIComponent(svgConNumero);

              // Aplicar como background-image: gradiente + SVG
              hero.style.backgroundImage =
                `linear-gradient(#221502da, #c0985c6d), url("${dataUri}")`;
            })
            .catch(err => {
              console.error("Error cargando el SVG del aniversario:", err);
            });
        }

        // ---------- 3. Ejecutar cuando el DOM esté listo ----------
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", aplicarLogoAniversario);
        } else {
          aplicarLogoAniversario();
        }
      })();
    })
  </script>
