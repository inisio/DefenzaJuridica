
<!-- Formulario Pro Bono -->
<section id="formulario" class="form-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="probono-form-container">
          <h2>Formulario de Solicitud Pro Bono</h2>
          <p class="text-muted mb-4">Complete este formulario con la mayor precisión posible. Toda la información proporcionada será tratada con estricta confidencialidad.</p>
          
          <form id="probono-form">
            <div class="row">
              <div class="col-md-6">
                <input type="text" name="nombre" class="form-control" placeholder="Nombre(s)" required>
              </div>
              <div class="col-md-6">
                <input type="text" name="apellidoP" class="form-control" placeholder="Apellido Paterno" required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <input type="text" name="apellidoM" class="form-control" placeholder="Apellido Materno" required>
              </div>
              <div class="col-md-6">
                <input type="number" name="edad" class="form-control" placeholder="Edad" min="1" max="120" required>
              </div>
            </div>
            
            <input type="text" name="contacto" class="form-control" placeholder="Correo electrónico o Teléfono" required>
            
            <div class="row">
              <div class="col-md-12">
                <input type="text" name="ciudad" class="form-control" placeholder="Ciudad" required>
              </div>
            </div>
            
            <textarea name="descripcion" class="form-control" placeholder="Describe tu caso legal (máximo 850 caracteres)" maxlength="900" required></textarea>
            
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="privacidad" required>
              <label class="form-check-label" for="privacidad">
                Acepto que mis datos sean tratados de acuerdo con la <a href="#">Política de Privacidad</a>
              </label>
            </div>
            
            <button type="submit" class="btn-submit">Enviar Solicitud</button>
            
            <div id="probono-status"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
let API_URL;

document.addEventListener("ensamblar:ready", () => {

    API_URL = "https://script.google.com/macros/s/AKfycbxIFDH6J0N-DBtYUmpCsOeAnTN5jiWfnjDqu5PNV6vOkt9zcSHaosOAlxobbgR8TkOY/exec";

    const form = document.getElementById("probono-form");

    if (!form) {
        console.error("No se encontró #probono-form");
        return;
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const formData = new FormData(event.target);

        const data = {
            nombre: formData.get("nombre")?.trim(),
            apellidoP: formData.get("apellidoP")?.trim(),
            apellidoM: formData.get("apellidoM")?.trim(),
            edad: formData.get("edad"),
            contacto: formData.get("contacto")?.trim(),
            ciudad: formData.get("ciudad")?.trim(),
            descripcion: formData.get("descripcion")?.trim(),
            costo: 0,
            estado: 0
        };

        // Validaciones
        if (!data.nombre || !data.apellidoP || !data.apellidoM) {
            showStatus("Completa nombre y apellidos", "probono-error");
            return;
        }

        if (data.descripcion.length > 850) {
            showStatus("La descripción supera los 850 caracteres", "probono-error");
            return;
        }

        const privacidad = document.getElementById("privacidad");

        if (!privacidad?.checked) {
            showStatus("Debes aceptar la política de privacidad", "probono-error");
            return;
        }

        showStatus("Enviando solicitud...", "probono-ok");

        try {

            const res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(data)
            });

            const json = await res.json();

            if (json.status === "ok") {

                showStatus(
                    `Solicitud enviada correctamente. ID: ${json.id}. Nos pondremos en contacto contigo pronto.`,
                    "probono-ok"
                );

                form.reset();

            } else {

                showStatus(
                    "Error al enviar la solicitud: " + (json.error || "desconocido"),
                    "probono-error"
                );

            }

        } catch (err) {

            console.error(err);

            showStatus(
                "Error al conectar con el servidor. Intenta nuevamente.",
                "probono-error"
            );

        }

    });

});

function showStatus(msg, type = "probono-ok") {

    const box = document.getElementById("probono-status");

    if (!box) {
        console.error("No existe #probono-status");
        return;
    }

    box.className = type;
    box.textContent = msg;
    box.style.display = "block";

    box.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}
</script>
